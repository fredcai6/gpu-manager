# Copy to ~/.config/gpu-manager/config.toml. Every key is optional; defaults are in
# gpu_manager/config.py.

# The compute card's PCI address (`gpu status` lists them). Unset: the AMD card with
# the most VRAM.
# pci_id = "0000:03:00.0"

# Env file for `docker compose` on interactive/docker-compose.yml: model file names,
# MODELS_HOST_PATH, aliases.
# env_file = "~/models.env"

# Proxy listen addresses. Loopback callers are batch; requests arriving on a Docker
# bridge gateway (the gate container, host.docker.internal) are interactive.
# listen = ["127.0.0.1", "172.17.0.1", "172.18.0.1"]

# Where the status page is written. Add a static site's directory to read it remotely.
# page_dirs = ["~/.local/state/gpu-manager/page", "/srv/site/gpu-status"]

# Batch may take the card after this long without an interactive request.
# hold_minutes = 30

# Headroom kept free on top of every job and the pair.
# margin_mib = 1024

# Single model: the env file above and the pair's measured VRAM.
# pair_vram_mib = 30000

# Several models in the LLM slot instead (replaces env_file / pair_vram_mib). Each env
# file holds the pair's full settings with that LLM; keep the ASR_* lines identical.
# default_model = "small"
#
# [models.small]
# env_file = "~/.config/gpu-manager/small.env"
# vram_mib = 12500
#
# [models.big]
# env_file = "~/.config/gpu-manager/big.env"
# aliases = ["big-model-file-name"]
# vram_mib = 27500
